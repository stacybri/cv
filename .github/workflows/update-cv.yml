name: Update and render CV

on:
  schedule:
    - cron: "0 12 * * 1" # weekly, Monday 12:00 UTC
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths:
      - "data/**"
      - "resume.Rmd"
      - "parsing_functions.R"
      - "scripts/**"
      - "css/**"

permissions:
  contents: write

jobs:
  update-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-renv@v2

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Fetch publications from ORCID + OpenAlex
        run: Rscript scripts/fetch_publications.R

      - name: Render CV (HTML + PDF)
        env:
          PAGEDOWN_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: Rscript scripts/render_cv.R

      - name: Commit and push if anything changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update CV data and render [skip ci]"
          file_pattern: "data/*.csv resume.html resume.pdf"
